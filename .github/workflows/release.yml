name: Build release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            command: pack:mac:release
            artifact: release-macos/*.dmg
          - name: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            command: pack:mac:release
            artifact: release-macos/*.dmg
          - name: windows-x64
            runner: windows-2022
            platform: win32
            arch: x64
            command: pack:win:release
            artifact: release-build/*.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Check version and native build host
        shell: node {0}
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          const assert = require('node:assert/strict')
          const { version } = require(`${process.env.GITHUB_WORKSPACE}/package.json`)
          assert.match(version, /^\d+\.\d+\.\d+$/)
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM)
          assert.equal(process.arch, process.env.EXPECTED_ARCH)
          if (process.env.GITHUB_REF_TYPE === 'tag') {
            assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Release tag must match package.json')
          }
      - run: npm ci
      - run: npm run lint
      - run: npm test -- src/main/windowsReleaseArchive.test.ts src/main/packagedOutput.test.ts
      - name: Build and verify package
        run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release and calculate checksums
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          files=("Anas-${version}-macos-arm64.dmg" "Anas-${version}-macos-x64.dmg" "Anas-${version}-windows-x64.zip")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --title "Anas $RELEASE_TAG" --generate-notes \
            --notes-file .github/RELEASE_NOTES.md
